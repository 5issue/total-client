name: PR Discord Notification

on:
  workflow_run:
    workflows: ['CI'] # 프론트 워크플로 1개. 늘어나면 여기에 추가
    types: [completed]

# 같은 커밋 = 마지막 이벤트만 살림 (중복 알림 억제)
concurrency:
  group: discord-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      (github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure')
    steps:
      - uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USER_MAP: ${{ vars.DISCORD_USER_MAP }} # JSON: {"gh-login":"discord-id"}
        with:
          script: |
            if (!process.env.DISCORD_WEBHOOK) {
              return core.warning("DISCORD_WEBHOOK_URL secret 미설정 → 알림 스킵");
            }
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;

            // PR 찾기 (workflow_run.pull_requests 는 fork/일부 케이스에서 빔)
            let ref = (run.pull_requests || [])[0];
            if (!ref) {
              const { data } = await github.rest.repos.listPullRequestsAssociatedWithCommit(
                { owner, repo, commit_sha: run.head_sha });
              ref = data.find((p) => p.state === "open");
            }
            if (!ref) return core.info("연결된 열린 PR 없음");

            const { data: pr } = await github.rest.pulls.get(
              { owner, repo, pull_number: ref.number });
            if (pr.state !== "open" || pr.draft) return core.info("닫힘/draft PR → 스킵");

            const ok = run.conclusion === "success";

            let map = {};
            try { map = JSON.parse(process.env.DISCORD_USER_MAP || "{}"); }
            catch { core.warning("DISCORD_USER_MAP JSON 파싱 실패"); }
            const m = (login) => (map[login] ? `<@${map[login]}>` : `\`${login}\``);

            const reviewers =
              [
                ...pr.requested_reviewers.map((r) => m(r.login)),
                ...pr.requested_teams.map((t) => `@${t.slug}`),
              ].join(", ") || "미배정";

            const content = ok
              ? [
                  "✅ **CI 통과 — 리뷰 부탁드립니다**",
                  `📌 ${pr.title}`,
                  `🔗 <${pr.html_url}>`,
                  `👤 작성자 ${m(pr.user.login)}`,
                  `👁️ 리뷰어 ${reviewers}`,
                ].join("\n")
              : [
                  "❌ **CI 실패 — 확인 필요**",
                  `📌 ${pr.title}`,
                  `🔗 <${pr.html_url}>`,
                  `👤 작성자 ${m(pr.user.login)}`,
                  `🪵 로그 <${run.html_url}>`,
                ].join("\n");

            const res = await fetch(process.env.DISCORD_WEBHOOK, {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({ content, allowed_mentions: { parse: ["users"] } }),
            });
            if (!res.ok) core.setFailed(`Discord webhook ${res.status}: ${await res.text()}`);
